version: "3.9"
services:
  bot:
    build: .
    container_name: idx_bot_v4
    restart: unless-stopped
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - PORT=8080
      - FEAT_RAG=true
      - FEAT_RISK=true
      - FEAT_SENT=true
      - FEAT_OPT=true
    ports: ["8080:8080"]
    volumes: ["./memory:/app/memory","./chroma_db:/app/chroma_db"]
    depends_on:
      redis:
        condition: service_healthy
    networks: [idx_net]

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --appendonly yes
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 10s; timeout: 5s; retries: 5
    networks: [idx_net]

volumes:
  redis_data:

networks:
  idx_net:
    driver: bridge
